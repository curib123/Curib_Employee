# .github/workflows/ci.yml | 2026-09-22
name: Curib Employee CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      CI_ENV: testing
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASS: root
      DB_NAME: Curib
      APP_BASE_URL: http://127.0.0.1:8080/
      CI_ENCRYPTION_KEY: ci-only-not-production-key
      COOKIE_SECURE: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mysqli, mbstring
          coverage: none

      - name: Validate Composer
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check
        shell: bash
        run: |
          set -euo pipefail
          php -l index.php
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find application tests -type f \( -name '*.php' -o -name '*.html' \) -print0)

      - name: JavaScript syntax check
        run: |
          node --check assets/js/app.js
          node --check assets/js/auth.js
          node --check assets/js/employees.js

      - name: Static security and UI checks
        shell: bash
        run: |
          set -euo pipefail

          if grep -RInE 'style[[:space:]]*=' application/views; then
            echo "Inline CSS style attributes are not allowed."
            exit 1
          fi

          if grep -RIn '<style' application/views; then
            echo "Internal style blocks are not allowed."
            exit 1
          fi

          if grep -RIn 'bootstrap@' application/views | grep -v 'bootstrap@5.3.3'; then
            echo "Bootstrap must remain pinned to 5.3.3."
            exit 1
          fi

          grep -q "cdn.jsdelivr.net" .htaccess
          grep -q "integrity=" application/views/auth/login.php
          grep -q "integrity=" application/views/auth/register.php
          grep -q "CREATE TABLE IF NOT EXISTS \`ci_sessions\`" database/curib.sql
          grep -q "CREATE TABLE IF NOT EXISTS \`login_attempts\`" database/curib.sql

          if grep -RIn 'registration_email' application; then
            echo "Removed registration_email variable must not return."
            exit 1
          fi

          if grep -RIn -- '->db->query(' application; then
            echo "Raw DB query usage is not allowed in application code."
            exit 1
          fi

      - name: Initialize database
        shell: bash
        run: |
          mysql -h 127.0.0.1 -uroot -proot < database/curib.sql
          mysql -h 127.0.0.1 -uroot -proot -e "USE Curib; SHOW TABLES;"
          mysql -h 127.0.0.1 -uroot -proot -e "USE Curib; DESCRIBE users; DESCRIBE ci_sessions; DESCRIBE login_attempts;"

      - name: Start application
        shell: bash
        run: |
          php -S 127.0.0.1:8080 tests/router.php > /tmp/curib-php-server.log 2>&1 &
          echo $! > /tmp/curib-php-server.pid
          sleep 2

      - name: End-to-end smoke test
        run: python3 tests/smoke.py

      - name: Verify smoke-test database state
        shell: bash
        run: |
          set -euo pipefail
          test "$(mysql -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM Curib.users WHERE email='ci-smoke@example.com';")" = "1"
          test "$(mysql -h 127.0.0.1 -uroot -proot -Nse "SELECT must_change_password FROM Curib.users WHERE email='ci-smoke@example.com';")" = "0"
          test "$(mysql -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM Curib.employee WHERE firstname='Smoke' AND lastname='Tester';")" = "1"
          test "$(mysql -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM Curib.login_attempts;")" = "0"

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/curib-php-server.log || true
